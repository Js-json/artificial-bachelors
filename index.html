<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CODr - Document Reader & Editor</title>
    <meta
      name="description"
      content="A client-side document reader and PDF editor for text, annotations, page management, and PDF export."
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <!-- Application Header -->
      <header class="app-header">
        <div class="brand">
          <div class="brand-icon">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"
              />
              <polyline points="14 2 14 8 20 8" />
              <path d="M8 13h8" />
              <path d="M8 17h8" />
              <path d="M10 9h2" />
            </svg>
          </div>
          CODr
        </div>

        <div class="header-center">
          <button
            class="btn btn-secondary"
            id="btn-toggle-sidebar"
            title="Toggle Thumbnail Sidebar"
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <rect x="3" y="3" width="18" height="18" rx="2" />
              <path d="M9 3v18" />
            </svg>
            Pages
          </button>

          <div class="doc-info" id="doc-info">
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"
              />
              <polyline points="13 2 13 9 20 9" />
            </svg>
            <span id="doc-name">No Document Loaded</span>
          </div>

          <span class="doc-info" id="page-indicator">Page 0 / 0</span>
        </div>

        <div class="header-actions">
          <button class="btn btn-secondary" id="btn-open-file">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="17 8 12 3 7 8" />
              <line x1="12" y1="3" x2="12" y2="15" />
            </svg>
            Open PDF
          </button>

          <button class="btn btn-primary" id="btn-export-pdf" disabled>
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="7 10 12 15 17 10" />
              <line x1="12" y1="15" x2="12" y2="3" />
            </svg>
            Download PDF
          </button>
        </div>
      </header>

      <!-- Main Workspace -->
      <main class="main-workspace">
        <!-- Left Tools Bar -->
        <aside class="tools-sidebar">
          <div class="tool-group">
            <button class="tool-btn active" data-tool="select" id="tool-select">
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="m3 3 7.07 16.97 2.51-7.39 7.39-2.51L3 3z" />
                <path d="m13 13 6 6" />
              </svg>
              <span class="tool-tooltip">Select / Hand</span>
            </button>

            <button class="tool-btn" data-tool="text" id="tool-text">
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <polyline points="4 7 4 4 20 4 20 7" />
                <line x1="9" y1="20" x2="15" y2="20" />
                <line x1="12" y1="4" x2="12" y2="20" />
              </svg>
              <span class="tool-tooltip">Add Text</span>
            </button>

            <button class="tool-btn" data-tool="draw" id="tool-draw">
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z" />
                <path d="m15 5 4 4" />
              </svg>
              <span class="tool-tooltip">Freehand Pen</span>
            </button>

            <button class="tool-btn" data-tool="highlight" id="tool-highlight">
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="m9 11-6 6v3h3l6-6" />
                <path
                  d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"
                />
              </svg>
              <span class="tool-tooltip">Highlighter</span>
            </button>

            <div class="divider"></div>

            <button class="tool-btn" data-tool="rect" id="tool-rect">
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <rect x="3" y="3" width="18" height="18" rx="2" />
              </svg>
              <span class="tool-tooltip">Rectangle</span>
            </button>

            <button class="tool-btn" data-tool="circle" id="tool-circle">
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <circle cx="12" cy="12" r="10" />
              </svg>
              <span class="tool-tooltip">Circle</span>
            </button>

            <button class="tool-btn" data-tool="line" id="tool-line">
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <line x1="5" y1="19" x2="19" y2="5" />
              </svg>
              <span class="tool-tooltip">Line / Arrow</span>
            </button>

            <div class="divider"></div>

            <button class="tool-btn" data-tool="whiteout" id="tool-whiteout">
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  d="M20 20H7L3 16C2 15 2 13 3 12L13 2C14 1 16 1 17 2L21 6C22 7 22 9 21 10L14 17"
                />
                <path d="M18 12L11 5" />
              </svg>
              <span class="tool-tooltip">Whiteout Box</span>
            </button>

            <button class="tool-btn" data-tool="image" id="tool-image">
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <rect width="18" height="18" x="3" y="3" rx="2" ry="2" />
                <circle cx="9" cy="9" r="2" />
                <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21" />
              </svg>
              <span class="tool-tooltip">Add Image / Stamp</span>
            </button>

            <div class="divider"></div>

            <button class="tool-btn" id="btn-undo" title="Undo Edit">
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M9 14 4 9l5-5" />
                <path
                  d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"
                />
              </svg>
              <span class="tool-tooltip">Undo</span>
            </button>

            <button
              class="tool-btn"
              id="btn-clear-page"
              title="Clear Page Edits"
            >
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M3 6h18" />
                <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" />
                <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />
              </svg>
              <span class="tool-tooltip">Clear Edits</span>
            </button>
          </div>
        </aside>

        <!-- Page Thumbnails Panel -->
        <aside class="pages-sidebar" id="pages-sidebar">
          <div class="sidebar-header">
            <span>Thumbnails</span>
            <div style="display: flex; gap: 0.35rem">
              <button
                class="btn-icon-only"
                id="btn-add-blank-page"
                title="Insert Blank Page"
              >
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <line x1="12" y1="5" x2="12" y2="19" />
                  <line x1="5" y1="12" x2="19" y2="12" />
                </svg>
              </button>
              <button
                class="btn-icon-only"
                id="btn-delete-current-page"
                title="Delete Current Page"
              >
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path d="M3 6h18" />
                  <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" />
                  <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />
                </svg>
              </button>
            </div>
          </div>
          <div class="thumbnail-list" id="thumbnail-list">
            <!-- Thumbnails populated dynamically -->
          </div>
        </aside>

        <!-- Center Editor Viewport Area -->
        <section class="editor-container">
          <!-- Tool Properties Toolbar -->
          <div class="properties-bar" id="properties-bar">
            <!-- Tool specific options rendered dynamically -->
            <div class="prop-group">
              <span class="prop-label">Color</span>
              <div class="color-picker-wrapper">
                <input
                  type="color"
                  id="prop-color"
                  class="color-picker"
                  value="#2E7D32"
                />
              </div>
            </div>

            <div class="prop-group" id="prop-group-size">
              <span class="prop-label">Size</span>
              <input
                type="number"
                id="prop-size"
                class="number-input"
                value="16"
                min="8"
                max="72"
                style="width: 60px"
              />
            </div>

            <div class="prop-group" id="prop-group-stroke">
              <span class="prop-label">Stroke</span>
              <input
                type="number"
                id="prop-stroke"
                class="number-input"
                value="3"
                min="1"
                max="30"
                style="width: 60px"
              />
            </div>

            <div class="prop-group" id="prop-group-opacity">
              <span class="prop-label">Opacity</span>
              <input
                type="range"
                id="prop-opacity"
                min="0.1"
                max="1"
                step="0.05"
                value="1"
                style="width: 100px"
              />
            </div>

            <button
              class="btn btn-secondary"
              id="btn-delete-selected"
              title="Delete Selected Area / Annotation (Keyboard: Del)"
              style="
                margin-left: auto;
                color: #ef4444;
                border-color: rgba(239, 68, 68, 0.3);
              "
            >
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <polyline points="3 6 5 6 21 6" />
                <path
                  d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"
                />
              </svg>
              Delete (Del)
            </button>
          </div>

          <!-- Scrollable Document Viewport -->
          <div class="viewport-area" id="viewport-area">
            <!-- Landing Dropzone Screen -->
            <div class="dropzone-overlay" id="dropzone-overlay">
              <div class="dropzone-card" id="dropzone-card">
                <div class="dropzone-icon">
                  <svg
                    width="32"
                    height="32"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="white"
                    stroke-width="2"
                  >
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                    <polyline points="17 8 12 3 7 8" />
                    <line x1="12" y1="3" x2="12" y2="15" />
                  </svg>
                </div>
                <h2 class="dropzone-title">Open or Drop a PDF File</h2>
                <p class="dropzone-subtitle">
                  Select a PDF document from your computer or drag and drop it
                  here to start editing.
                </p>

                <div style="display: flex; gap: 1rem; margin-top: 0.5rem">
                  <button class="btn btn-primary" id="btn-select-file">
                    Browse File
                  </button>

                  <button class="btn btn-secondary" id="btn-load-sample">
                    Load Sample PDF
                  </button>
                </div>
              </div>
            </div>

            <!-- Document Pages Container -->
            <div
              id="pages-container"
              style="
                display: flex;
                flex-direction: column;
                gap: 2rem;
                align-items: center;
                width: 100%;
              "
            >
              <!-- Rendered Page Cards will be injected here -->
            </div>
          </div>

          <!-- Floating Zoom & Navigation Bar -->
          <div class="zoom-controls">
            <button class="btn-icon-only" id="btn-zoom-out" title="Zoom Out">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <line x1="5" y1="12" x2="19" y2="12" />
              </svg>
            </button>

            <span class="zoom-text" id="zoom-value">100%</span>

            <button class="btn-icon-only" id="btn-zoom-in" title="Zoom In">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <line x1="12" y1="5" x2="12" y2="19" />
                <line x1="5" y1="12" x2="19" y2="12" />
              </svg>
            </button>

            <button
              class="btn-icon-only"
              id="btn-zoom-reset"
              title="Reset Zoom"
            >
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                <path d="M3 3v5h5" />
              </svg>
            </button>
          </div>
        </section>
      </main>

      <!-- Hidden file inputs -->
      <input type="file" id="file-input" accept="application/pdf" />
      <input
        type="file"
        id="image-stamp-input"
        accept="image/png, image/jpeg, image/webp"
      />

      <!-- MS Word Floating Context Toolbar -->
      <div id="word-floating-toolbar" class="word-floating-toolbar hidden">
        <button
          class="word-btn"
          id="word-btn-copy"
          title="Copy Selected Text (Ctrl+C)"
        >
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
            <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
          </svg>
          Copy
        </button>

        <button
          class="word-btn"
          id="word-btn-paste"
          title="Paste Text (Ctrl+V)"
        >
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"
            />
            <rect width="8" height="4" x="8" y="2" rx="1" ry="1" />
          </svg>
          Paste
        </button>

        <div class="word-divider"></div>

        <button class="word-btn" id="word-btn-highlight" title="Highlight Text">
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#f59e0b"
            stroke-width="2"
          >
            <path d="m9 11-6 6v3h3l6-6" />
            <path
              d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"
            />
          </svg>
          Highlight
        </button>

        <button
          class="word-btn danger"
          id="word-btn-delete"
          title="Delete / Erase Text (Del)"
        >
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <polyline points="3 6 5 6 21 6" />
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
          </svg>
          Delete
        </button>
      </div>

      <!-- MS Word Custom Right-Click Context Menu -->
      <div id="word-context-menu" class="word-context-menu hidden">
        <div class="ctx-item" id="ctx-copy">
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
            <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
          </svg>
          Copy <span>Ctrl+C</span>
        </div>
        <div class="ctx-item" id="ctx-paste">
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"
            />
            <rect width="8" height="4" x="8" y="2" rx="1" ry="1" />
          </svg>
          Paste <span>Ctrl+V</span>
        </div>
        <div class="ctx-divider"></div>
        <div class="ctx-item" id="ctx-highlight">
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#f59e0b"
            stroke-width="2"
          >
            <path d="m9 11-6 6v3h3l6-6" />
            <path
              d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"
            />
          </svg>
          Highlight Text
        </div>
        <div class="ctx-item danger" id="ctx-delete">
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <polyline points="3 6 5 6 21 6" />
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
          </svg>
          Delete / Erase Text <span>Del</span>
        </div>
      </div>

      <!-- Toast Notifications Container -->
      <div class="toast-container" id="toast-container"></div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
